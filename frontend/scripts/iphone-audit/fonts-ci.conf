<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make local Chromium pick the fonts GitHub's ubuntu runner has
     (DejaVu Sans), not Inter, so the iPhone guard measures text the
     same way CI does. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>/usr/share/fonts/opentype/inter/*</glob></rejectfont></selectfont>
</fontconfig>
