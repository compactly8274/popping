name: popping

# Production / default: pulls prebuilt images from GHCR.
# Tag is controlled by POPPING_IMAGE_TAG (default: latest).
# Registry owner is controlled by POPPING_IMAGE_OWNER (default: adamjmachill).
#
# Update flow (tracks main):
#   docker compose pull        # fetches new :latest from GHCR if digest moved
#   docker compose up -d       # recreates containers with the new image
#
# ``pull_policy`` defaults to ``always`` (also overridable via
# POPPING_PULL_POLICY in .env) so a plain ``docker compose up -d``
# will already pull a rotated :latest — the explicit ``pull`` step
# above is only needed if you override the policy to ``missing`` /
# ``never``. See .env.example for the trade-offs.
#
# Port surface:
#   - frontend:   the only published port. Bound to 127.0.0.1:14789 by
#                 default, so only the host itself (or a tunnel running
#                 on it) can reach it. Docker's port rules bypass ufw, so
#                 binding 0.0.0.0 on a VPS exposes it to the internet.
#                 Override with POPPING_FRONTEND_HOST / POPPING_FRONTEND_PORT
#                 (container port is 8080, nginx).
#   - backend:    not published. Reachable only via the frontend's
#                 nginx proxy (/api, /assets, /auth) on the docker network.
#   - postgres:   not published. Internal-only.
#   - guard-proxy: not published, and not started at all unless the
#                 "hardened" profile is enabled. Internal-only egress
#                 guard for the backend's outbound requests — see
#                 egress-proxy/README.md.
#
#   - cloudflared: optional ("tunnel" profile). Connects outbound to
#                 Cloudflare and serves the frontend at your hostname —
#                 no published port needed. Put Cloudflare Access in front.
#
# To expose on the LAN, set POPPING_FRONTEND_HOST=0.0.0.0 and put a
# reverse proxy in front for TLS + auth.
#
# For local dev with hot-reload, drop a docker-compose.override.yml next
# to this file. The override is auto-loaded by `docker compose up` and
# switches both services to `build: ./...` with bind mounts. See
# docker-compose.override.yml.example for the contents.

# Cap container logs so a chatty service can't fill a small VPS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popping}
      POSTGRES_DB: ${POSTGRES_DB:-popping}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-popping} -d ${POSTGRES_DB:-popping}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional network-level SSRF hardening — see egress-proxy/README.md
  # for the full model and how to verify it. Off by default (profile-
  # gated); enable by setting COMPOSE_PROFILES=hardened plus
  # HTTP_PROXY/HTTPS_PROXY in .env. Not published — only reachable
  # from other containers on this compose network.
  guard-proxy:
    build: ./egress-proxy
    restart: unless-stopped
    logging: *default-logging
    profiles: ["hardened"]

  backend:
    image: ghcr.io/${POPPING_IMAGE_OWNER:-adamjmachill}/popping-backend:${POPPING_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    pull_policy: ${POPPING_PULL_POLICY:-always}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Cached favicons + thumbnails written by ingest and served at /assets.
      - assets:/app/assets
      # Downloaded embedding model, so a container recreate doesn't
      # re-download it.
      - models:/home/app/.cache
    # Map host.docker.internal to the docker host's gateway IP. The
    # default OLLAMA_BASE_URL points at host.docker.internal:11434 so
    # the backend can reach an Ollama instance running on the host
    # (typical Linux setup). The gateway IP is the well-known address
    # for this on Linux Docker; on Docker Desktop / macOS the hostname
    # is already resolvable natively. Override OLLAMA_BASE_URL in .env
    # if your Ollama runs somewhere else (a separate container, a
    # different host, etc.).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Embedding model (~1 GB resident) + torch; leave headroom on a 4 GB host.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # No published port — backend is only reachable from the frontend
    # via the docker network.

  frontend:
    image: ghcr.io/${POPPING_IMAGE_OWNER:-adamjmachill}/popping-frontend:${POPPING_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    pull_policy: ${POPPING_PULL_POLICY:-always}
    mem_limit: 128m
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # nginx listens on 8080 inside the container; only the host side
      # is configurable via POPPING_FRONTEND_PORT.
      - "${POPPING_FRONTEND_HOST:-127.0.0.1}:${POPPING_FRONTEND_PORT:-14789}:8080"

  # Optional Cloudflare Tunnel. Enable with COMPOSE_PROFILES=tunnel and
  # TUNNEL_TOKEN in .env. In the Cloudflare dashboard, point the tunnel's
  # public hostname at http://frontend:8080.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tunnel"]
    mem_limit: 128m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  pgdata:
  assets:
  models: