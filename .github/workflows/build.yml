name: build

# Build both container images on every push to main and on every PR that
# targets main. Push to GHCR only on push-to-main (PR builds are
# validation-only — they confirm "the merge would still build").
#
# Tags produced:
#   ghcr.io/<owner>/popping-backend:main        <- every push to main
#   ghcr.io/<owner>/popping-backend:sha-<full sha> <- every push to main
#   ghcr.io/<owner>/popping-frontend:main
#   ghcr.io/<owner>/popping-frontend:sha-<full sha>
#   ghcr.io/<owner>/popping-{backend,frontend}:latest  <- every push to main
#   PR builds are never pushed: login and push run only on push events
#   (both image jobs), so a PR's pr-<num> tag exists only inside its run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # only needed on push-to-main; safe to declare unconditionally

# The event is part of the group: a PR's run that GitHub creates only
# after the PR was merged runs with the base branch's ref, and with the
# ref alone it cancelled the push-to-main run that publishes the images.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: popping_test
          POSTGRES_PASSWORD: popping_test
          POSTGRES_DB: popping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U popping_test -d popping_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + test deps
        working-directory: backend
        # Same pins as the image: CPU torch (version from the Dockerfile),
        # then the lockfile, then the app itself.
        run: |
          TORCH_VERSION=$(sed -n 's/^ARG TORCH_VERSION=//p' Dockerfile)
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Create pgvector extension
        run: |
          PGPASSWORD=popping_test psql -h localhost -U popping_test -d popping_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Run pytest
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: popping_test
          POSTGRES_PASSWORD: popping_test
          POSTGRES_DB: popping_test
        # -ra shows the short summary of every failed/error test at the
        # end of the run. `set -o pipefail` keeps the exit code honest
        # while teeing the output to a file for the annotation pass.
        # The annotation pass below re-emits every FAILED/ERROR line as
        # a `::error::` workflow command — GitHub turns those into
        # check-run annotations, which are readable from the PUBLIC
        # annotations API even when raw job logs require admin rights.
        # Without this, a red test run reports only "Process completed
        # with exit code 1" and the failure can only be diagnosed by an
        # admin reading the full log — which blocked three debugging
        # cycles on PR #96.
        run: |
          set -o pipefail
          pytest -ra 2>&1 | tee pytest_output.txt

      - name: Emit failure annotations
        if: failure()
        working-directory: backend
        run: |
          # Every line that starts with "FAILED" or "ERROR" from pytest's
          # short summary becomes a workflow-command error annotation.
          grep -E '^(FAILED|ERROR)' pytest_output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  frontend-checks:
    name: frontend lint + build
    # Lint, build, unit tests and the smoke run take about 12 minutes,
    # but on a slow Ubuntu mirror the browser install alone has taken 17;
    # still fail well before GitHub's 6h default.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Read-only token, and not left in the checkout: this job downloads
    # Playwright and browsers, and must not be able to push an image.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc + vite build
      - run: npm run build
      # The rules the feed editor and Add form share (src/lib), run
      # straight from the TypeScript source with Node's type stripping.
      - name: Unit tests
        run: node --experimental-strip-types --test 'scripts/unit/*.test.ts'
      # Playwright is installed for this run only: --no-save plus the
      # diff check prove package.json, the lockfile and the Docker
      # build stay untouched.
      - name: Install Playwright (not saved)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.1
          git diff --exit-code package.json package-lock.json
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          nohup ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4173/ && exit 0; sleep 0.5; done
          cat /tmp/preview.log; exit 1
      # Renders the main screens at iPhone sizes against a mocked API and
      # fails on text or boxes running past their container
      # (frontend/scripts/iphone-audit/README.md).
      - name: iPhone layout smoke test
        run: node scripts/iphone-audit/smoke.cjs http://127.0.0.1:4173 --csp --strict

  # The Safari-engine run only reports, so it is its own job: the frontend
  # image never waits on it. WebKit's system packages (GStreamer, ffmpeg)
  # are the bulk of the apt download, and on a slow Ubuntu mirror they
  # ran the frontend job past its timeout so no image was published.
  frontend-safari-report:
    name: frontend Safari report
    timeout-minutes: 30
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright WebKit (not saved)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.1
          git diff --exit-code package.json package-lock.json
          npx playwright install --with-deps webkit
      - name: Start preview
        run: |
          nohup ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4173/ && exit 0; sleep 0.5; done
          cat /tmp/preview.log; exit 1
      # States only: the behaviour flows drive Chromium (CDP touch) and
      # would roughly double the job's time here for a report nobody gates on.
      - name: iPhone layout smoke test (Safari engine, report only)
        run: node scripts/iphone-audit/smoke.cjs http://127.0.0.1:4173 --browser webkit --states-only

  build-backend:
    name: backend image
    # A normal build takes a few minutes; fail fast instead of GitHub's 6h default.
    timeout-minutes: 30
    # Never publish an image whose tests failed: compose pulls :latest.
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/popping-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single platform only — keeps the published manifest a plain
          # Docker v2 manifest, not an OCI image index. GHCR returns 404
          # on OCI image indexes to clients that don't include the OCI
          # index accept header (which plain `docker pull` does not),
          # and that breaks anonymous `docker compose pull`.
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=popping-backend
          cache-to: type=gha,mode=max,scope=popping-backend

  build-frontend:
    name: frontend image
    # A normal build takes a few minutes; fail fast instead of GitHub's 6h default.
    timeout-minutes: 30
    # Never publish an image whose tests failed: compose pulls :latest.
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/popping-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See backend job: single-platform + no provenance keeps the
          # published manifest a plain Docker v2 manifest that anonymous
          # `docker pull` can read.
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=popping-frontend
          cache-to: type=gha,mode=max,scope=popping-frontend