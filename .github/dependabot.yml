# Weekly update PRs for pinned dependencies. CI must pass before merging.
# torch is pinned separately (TORCH_VERSION in backend/Dockerfile) and the
# Python lockfiles are regenerated with backend/scripts/lock.sh, so bump
# those by hand when a Dependabot pip PR touches pyproject.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
