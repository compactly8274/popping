<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<!-- A soft 404: the server answers 200, but the page is the theme's
     "not found" template (WordPress default wording). -->
<title>Page not found – Example Town News</title>
<meta name="robots" content="noindex, follow">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Page not found - Example Town News">
<meta property="og:site_name" content="Example Town News">
</head>
<body class="error404">
<header id="masthead"><p class="site-title"><a href="https://www.example.com/">Example Town News</a></p></header>
<main id="main" class="site-main">
  <section class="error-404 not-found">
    <header class="page-header"><h1 class="page-title">Oops! That page can&rsquo;t be found.</h1></header>
    <div class="page-content">
      <p>It looks like nothing was found at this location. Maybe try a search?</p>
      <form role="search" method="get" action="https://www.example.com/"><input type="search" name="s"></form>
    </div>
  </section>
</main>
<footer><a href="/privacy-policy/">Privacy policy</a></footer>
</body>
</html>
